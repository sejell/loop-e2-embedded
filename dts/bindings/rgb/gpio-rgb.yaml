description: Three GPIO controlled LEDs used as an RGB indicator

compatible: "gpio-rgb"

include: base.yaml

properties:
  red-gpios:
    type: phandle-array
    required: true
    description: GPIO connected to the red LED

  green-gpios:
    type: phandle-array
    required: true
    description: GPIO connected to the green LED

  blue-gpios:
    type: phandle-array
    required: true
    description: GPIO connected to the blue LED